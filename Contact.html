<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Charlie Wu</title>
  <meta name="description" content="Contact Charlie Wu by email.">
  <meta name="theme-color" content="#faf9f6">
  <link rel="canonical" href="https://cwu4570.github.io/Contact.html">
  <link rel="icon" href="nodal-cubic-favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">

  <style>
    /*
      Mobile-only navigation.
      Nothing in this block changes the desktop layout.
    */
    @media screen and (max-width: 700px) {
      .site-header .header-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: .35rem;
        padding-block: .9rem .6rem;
      }

      /* Allow the navigation row—not the whole page—to scroll. */
      .site-header .site-nav {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }

      /* Keep all links in one row instead of a multirow grid. */
      .site-header .site-nav ul {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 1.1rem;
        width: max-content;
        min-width: 100%;
        margin: 0;
        padding: .2rem .15rem .35rem;
        list-style: none;
      }

      .site-header .site-nav li {
        flex: 0 0 auto;
      }

      /*
        Comfortable tap targets.
        Existing link colors and active-page underline are preserved.
      */
      .site-header .site-nav a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: auto;
        min-width: 44px;
        min-height: 44px;
        padding: .4rem .25rem;
        white-space: nowrap;
      }

      /* Keep keyboard focus outlines inside the scrollable area. */
      .site-header .site-nav a:focus-visible {
        outline-offset: -2px;
      }

      /* Style the scrollbar when the browser shows it. */
      .site-header .site-nav::-webkit-scrollbar {
        height: 4px;
      }

      .site-header .site-nav::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 999px;
      }

      .site-header .site-nav::-webkit-scrollbar-track {
        background: transparent;
      }
    }
  </style>

  <meta property="og:title" content="Contact · Charlie Wu">
  <meta property="og:description" content="Contact Charlie Wu by email.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cwu4570.github.io/Contact.html">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" href="index.html">Charlie Wu</a>

      <nav class="site-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="Research.html">Research</a></li>
          <li><a href="Talk-Notes.html">Talk Notes</a></li>
          <li><a href="Coding-Projects.html">Code</a></li>
          <li><a href="Teaching.html">Teaching</a></li>
          <li><a href="Gallery.html">Gallery</a></li>
          <li><a href="Contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    <h1>Contact</h1>

    <div class="prose">
      <p>Please email me at:</p>

      <div class="contact-addresses">
        <p>
          <a href="mailto:charliewu.math@gmail.com">charliewu.math@gmail.com</a>
          <small>I check this address much more often.</small>
        </p>

        <p>
          <a href="mailto:cwu@mpim-bonn.mpg.de">cwu@mpim-bonn.mpg.de</a>
        </p>
      </div>

      <p class="contact-note">
        I would also link you my website, but you are already here!
      </p>
    </div>
  </main>

  <script>
    (() => {
      const navigation = document.querySelector(".site-header .site-nav");
      if (!navigation) return;

      const currentLink = navigation.querySelector('[aria-current="page"]');
      if (!currentLink) return;

      const mobile = window.matchMedia("screen and (max-width: 700px)");

      function revealCurrentLink() {
        if (!mobile.matches) return;

        // Preserve a keyboard user's focused link when resizing.
        const target = navigation.querySelector("a:focus") || currentLink;
        const navBox = navigation.getBoundingClientRect();
        const linkBox = target.getBoundingClientRect();

        // Scroll only this row, never the page itself.
        navigation.scrollLeft +=
          linkBox.left - navBox.left -
          (navigation.clientWidth - linkBox.width) / 2;
      }

      // Keep keyboard-focused links visible without moving links on a tap.
      navigation.addEventListener("focusin", (event) => {
        if (event.target.matches("a:focus-visible")) {
          revealCurrentLink();
        }
      });

      revealCurrentLink();

      // Recheck after the web font finishes loading.
      if (document.fonts) {
        document.fonts.ready.then(revealCurrentLink);
      }

      // Ignore height-only changes from a phone's browser toolbar.
      let previousWidth = window.innerWidth;

      window.addEventListener("resize", () => {
        if (window.innerWidth === previousWidth) return;
        previousWidth = window.innerWidth;
        revealCurrentLink();
      });
    })();
  </script>
</body>

</html>
